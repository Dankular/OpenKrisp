# Copy this file to .github/workflows/ci.yml (the session that wrote it could not push to that path: missing `workflow` token scope).
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MODEL_URL: https://huggingface.co/Ceva-IP/DPDFNet/resolve/main/onnx/dpdfnet2_48khz_hr.onnx?download=true

jobs:
  linux:
    name: Rust + .NET tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Format check
        run: cargo fmt --all --check

      # The model is downloaded only so the tests can run; it is not redistributed by this repo or its releases.
      - name: Download model for tests
        run: |
          mkdir -p models
          curl -fL --retry 5 --retry-delay 5 -o models/dpdfnet2_48khz_hr.onnx "$MODEL_URL"
          ls -l models

      # tenvad links libten_vad (not vendored, license has extra conditions), so it is excluded here.
      - name: Rust tests
        env:
          OPENKRISP_MODEL: ${{ github.workspace }}/models/dpdfnet2_48khz_hr.onnx
        run: cargo test --workspace --exclude tenvad --release

      - name: .NET tests (real calls into the Rust engine library)
        env:
          OPENKRISP_MODEL: ${{ github.workspace }}/models/dpdfnet2_48khz_hr.onnx
        run: |
          cargo build --release -p openkrisp-engine
          LD_LIBRARY_PATH="$PWD/target/release" dotnet test app/OpenKrisp.Core.Tests -c Release

  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Rust (engine DLL, CLI, virtual-mic spike tool)
        shell: pwsh
        run: |
          cargo build --release -p openkrisp-engine --features audio
          cargo build --release -p voiceclean
          cargo build --release -p virtualmic --example tone

      - name: Download model for tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile models/dpdfnet2_48khz_hr.onnx -MaximumRetryCount 5 -RetryIntervalSec 5
          (Get-Item models/dpdfnet2_48khz_hr.onnx).Length

      - name: .NET tests on Windows (first real run of the DLL through P/Invoke)
        shell: pwsh
        env:
          OPENKRISP_MODEL: ${{ github.workspace }}/models/dpdfnet2_48khz_hr.onnx
        run: |
          $env:PATH = "$PWD\target\release;$env:PATH"
          dotnet test app/OpenKrisp.Core.Tests -c Release

      - name: Publish WinUI app
        shell: pwsh
        run: dotnet publish app/OpenKrisp.App/OpenKrisp.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o dist/OpenKrisp

      - name: Assemble zip
        shell: pwsh
        run: |
          Copy-Item target/release/openkrisp_engine.dll dist/OpenKrisp/
          New-Item -ItemType Directory -Force dist/OpenKrisp/tools | Out-Null
          Copy-Item target/release/voiceclean.exe dist/OpenKrisp/tools/
          Copy-Item target/release/examples/tone.exe dist/OpenKrisp/tools/
          Copy-Item packaging/get-model.ps1, packaging/README-RUN.txt dist/OpenKrisp/
          Compress-Archive -Path dist/OpenKrisp -DestinationPath OpenKrisp-win-x64.zip
          (Get-FileHash OpenKrisp-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  OpenKrisp-win-x64.zip" | Out-File -Encoding ascii OpenKrisp-win-x64.zip.sha256
          Get-ChildItem dist/OpenKrisp | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            OpenKrisp-win-x64.zip
            OpenKrisp-win-x64.zip.sha256

  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenKrisp-win-x64.zip OpenKrisp-win-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --prerelease --title "OpenKrisp $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
