[workspace]
resolver = "3"
members = ["crates/agc", "crates/dpdf", "crates/engine", "crates/gate", "crates/live", "crates/pipeline", "crates/resample", "crates/tenvad", "crates/voiceclean"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
hound = "3"
realfft = "3"
tract-onnx = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
