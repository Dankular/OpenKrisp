[package]
name = "openkrisp-engine"
description = "Control + processing engine with a C ABI for the OpenKrisp UI (two lanes: my mic, incoming audio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "openkrisp_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
dpdf = { path = "../dpdf" }
live = { path = "../live", optional = true }
virtualmic = { path = "../virtualmic", optional = true }

[features]
# Live audio sessions (capture -> lane -> sink) through cpal; needs libasound2-dev on Linux. Enabled for Windows builds.
audio = ["dep:live", "live/audio", "dep:virtualmic"]
